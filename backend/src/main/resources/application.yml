server:
  port: 8080

spring:
  application:
    name: smart-traffic-intelligence

  # Redis Configuration
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

  # ClickHouse DataSource (via JDBC)
  datasource:
    url: ${CLICKHOUSE_URL:jdbc:clickhouse://clickhouse:8123/default}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    username: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 2

  # Jackson
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
    default-property-inclusion: NON_NULL

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.traffic: DEBUG
    org.springframework.web.socket: WARN
    org.springframework.messaging: WARN
    com.clickhouse: WARN
